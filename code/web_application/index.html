<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HW2-AlyssaGomez</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 16px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      background-color: #fef2f2
    }

    h1 {
      font-size: 1.5rem;
      word-wrap: break-word;
    }

    form div {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="email"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #999;
      border-radius: 4px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-row label {
      display: inline;
      font-weight: normal;
      margin-bottom: 0;
    }

    #loadingState,
    #emptyState,
    #errorState {
      display: none;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    #loadingState {
      background-color: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    #emptyState {
      background-color: #f9fafb;
      color: #374151;
      border: 1px solid #e5e7eb;
      text-align: center;
    }

    #errorState {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    #listingsList {
      list-style: none;
      padding: 0;
    }

    #listingsList li {
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 8px;
    }

    @media (max-width: 375px) {
      body {
        padding: 10px;
      }
      h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <h1>Rental Housing Listing</h1>

   <div>
    <label for="searchInput">Search listings:</label><br />
    <input
      type="text"
      id="searchInput"
      placeholder="Search by address or landlord name"
    />
  </div>
  <br />
  
  <div id="loadingState">Loading listings...</div>
  <div id="emptyState">No rental listings yet — add one below!</div>
  <div id="errorState">Something went wrong loading listings. Please try again.</div>

  <ul id="listingsList"></ul>

  <button id="updateBtn" type="button">Update Listing #1</button>
  <br /><br />

  <button id="deleteBtn" type="button">Delete Highest ID Listing</button>
  <br /><br />

  <form id="listingForm">
    <div>
      <label for="address">Property Address:</label><br />
      <input
        type="text"
        id="address"
        name="address"
        placeholder="e.g. 123 Main St, San Jose, CA"
        autofocus
        required
      />
    </div>
    <br />

    <div>
      <label for="landlordName">Landlord / Property Manager Name:</label><br />
      <input
        type="text"
        id="landlordName"
        name="landlordName"
        placeholder="e.g. Jane Smith Property Management"
        required
      />
    </div>
    <br />

    <div>
      <label for="submitterEmail">Your Email:</label><br />
      <input
        type="email"
        id="submitterEmail"
        name="submitterEmail"
        placeholder="e.g. you@example.com"
        required
      />
    </div>
    <br />

    <div>
      <label for="description">Listing Description:</label><br />
      <textarea
        id="description"
        name="description"
        placeholder="Describe the unit: amenities, square footage, nearby transit, lease terms, etc."
        required
      ></textarea>
    </div>
    <br />

    <div>
      <label for="category">Unit Type:</label><br />
      <select id="category" name="category">
        <option value="Studio">Studio</option>
        <option value="1 Bedroom">1 Bedroom</option>
        <option value="2 Bedroom">2 Bedroom</option>
        <option value="3+ Bedroom">3+ Bedroom</option>
      </select>
    </div>
    <br />

    <div class="checkbox-row">
      <input type="checkbox" id="terms" name="terms" />
      <label for="terms">I agree to the terms and conditions.</label>
    </div>
    <br />

    <button type="submit">Submit Listing</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
