<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Rental Housing Listings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar-custom {
      background-color: #3EB489;
    }
    .btn-primary {
      background-color: #3EB489;
      border-color: #3EB489;
    }
    .btn-primary:hover {
      background-color: #349d76;
      border-color: #349d76;
    }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/">Rental Housing Listings</a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h1>Welcome to Rental Housing Listings</h1>
        <p>Browse and manage rental listings for the San Jose area.</p>

        {% if user %}
          <p>Logged in as <strong>{{ user }}</strong></p>
          <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
          <a href="/logout" class="btn btn-outline-secondary">Log Out</a>
        {% else %}
          <a href="/login" class="btn btn-primary">Log In</a>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
